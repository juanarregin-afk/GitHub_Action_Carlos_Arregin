name: Test Validar Rama
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      nombre:
        description: Nombre de la rama que quieres validar
        required: true
        type: string

jobs:
  validar-rama:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar rama
        id: validar
        uses: ./.github/actions/ValidarRama
        with:
          nombre: ${{ inputs.nombre || github.ref_name }}

      - name: Mostrar resultado
        run: 'echo "La rama ingresada fue: ${{ inputs.nombre || github.ref_name }}. Resultado: ${{ steps.validar.outputs.resultado }}"'
